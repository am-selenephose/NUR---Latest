workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH'

stages: [test]

web-and-security:
  stage: test
  image: node:22-bookworm
  cache:
    key: "npm-${CI_COMMIT_REF_SLUG}"
    paths: [.npm/]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ripgrep
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    - npm run release:naming-scan
    - npm run secret-scan
    - npm run web:typecheck
    - npm run web:test
    - npm run web:build
    - npm run web:e2e:mocked
    - npm run mobile:typecheck
    - npm audit --audit-level=high
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - apps/web/dist/
      - apps/web/playwright-report/
      - apps/web/test-results/

api-openapi-drift:
  stage: test
  image: node:22-bookworm
  cache:
    key: "npm-drift-${CI_COMMIT_REF_SLUG}"
    paths: [.npm/]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  script:
    - npm ci
    - npm run api:openapi-drift:test
    - npm run api:openapi-drift

api:
  stage: test
  image: python:3.12-bookworm
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      command: ["postgres", "-c", "port=55432", "-c", "listen_addresses=127.0.0.1"]
    - name: redis:7
      alias: redis
      command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--port", "56379"]
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    NUR_TEST_SUPERUSER_DSN: "postgresql://postgres:postgres@127.0.0.1:55432/postgres"
    REDIS_URL: "redis://127.0.0.1:56379/0"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-${CI_COMMIT_REF_SLUG}"
    paths: [.cache/pip/]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client redis-tools
    - until pg_isready -h 127.0.0.1 -p 55432 -U postgres; do sleep 2; done
    - until redis-cli -h 127.0.0.1 -p 56379 ping | grep -q PONG; do sleep 2; done
    - cd apps/api
    - python -m pip install -r requirements-dev.lock
    - python -m pip install --no-deps -e .
  script:
    - python -m ruff check app
    - python -m pytest
